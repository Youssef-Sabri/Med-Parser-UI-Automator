services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: medparser-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - staging_data:/app/staging

  frontend:
    build: ./frontend
    container_name: medparser-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
    depends_on:
      - backend
    env_file:
      - .env

volumes:
  staging_data:
